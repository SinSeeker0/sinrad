<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Norma</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;}
  #stage{position:relative;width:100%;height:100%}
  #menu{position:absolute;right:10px;bottom:10px;top:auto;transform:none;width:176px;left:auto;background:#15151d;border:1px solid #272733;border-radius:6px;
    padding:6px;box-shadow:none;display:none;z-index:10}
  #menu.show{display:block}
  #menu .mi{padding:8px 10px;border-radius:4px;font-size:12.5px;font-weight:600;color:#cfd3dc;display:flex;gap:9px;align-items:center;cursor:pointer}
  #menu .mi:hover{background:#1e1e27;color:#fff}
  #menu .mi[data-nav="vault"]{padding-right:10px}
  #menu .dv{height:1px;background:#1a1a23;margin:5px 4px}
  /* NO box / outline — just the gif; size is set to the image aspect at runtime */
  #pet{position:absolute;left:10px;bottom:10px;top:auto;transform:none;width:120px;height:120px;
    background:transparent;display:grid;place-items:center;cursor:grab;z-index:1;border:none;border-radius:0;overflow:visible;box-shadow:none}
  #pet:active{cursor:grabbing}
  #pet img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;-webkit-user-drag:none}
  #pet .emo{font-size:62px;line-height:1}

  #menu .mi svg{width:15px;height:15px;flex:0 0 auto}
  #slogan{
    padding:7px 8px;
    font-size:8.5px;
    letter-spacing:.65px;
    font-weight:800;
    text-transform:uppercase;
    line-height:1.35;
    background-image:linear-gradient(90deg,#ff4d8d,#ffb020,#fff6a8,#33d17a,#27b4ff,#b14bff,#ff4d8d);
    background-size:200% 100%;
    background-repeat:repeat;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    animation:sloganShift 5.5s linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,77,141,.35));
  }
  @keyframes sloganShift{
    from{background-position:0% 50%}
    to{background-position:200% 50%}
  }
  #menu .mi[data-pin]{color:#ff79c6}
  #menu .mi[data-pin]:hover{background:rgba(255,77,141,.12);color:#ff9ad4}

  .rf-head{padding:6px 10px 2px;font-size:9px;letter-spacing:.7px;font-weight:700;color:#ff79c6;text-transform:uppercase}
  .rf-list{display:flex;flex-direction:column;gap:1px;padding:0 4px 4px}
  .rf-empty{padding:4px 8px 6px;font-size:11px;color:#5c6070}
  .rf-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#cfd3dc;cursor:pointer;min-width:0}
  .rf-item:hover{background:#1e1e27;color:#fff}
  .rf-item .rf-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rf-pin{flex:0 0 auto;display:inline-flex;color:#ff79c6}
  .rf-pin svg{width:12px;height:12px}
  .kill-wrap{padding:4px 0 0;margin:2px -6px -6px}
  .pet-kill{width:100%;height:26px;border:1px solid #ff5470;border-left:none;border-right:none;border-bottom:none;border-radius:0 0 5px 5px;background:#1a0c10;color:#ff5470;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .pet-kill svg{width:13px;height:13px;flex:0 0 auto}
  .pet-kill:hover{background:rgba(255,84,112,.16);color:#ff8a9c}
  .pet-kill.armed{background:#ff5470;color:#fff;animation:killPulse 1.6s ease-in-out infinite}
  @keyframes killPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,84,112,.5)}70%{box-shadow:0 0 0 8px rgba(255,84,112,0)}}
  #petTimer{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);display:none;justify-content:center;pointer-events:none;z-index:6;width:auto;bottom:auto}
  #petTimer.show{display:flex}
  #petTimer span{background:#1a0c10;border:1px solid #ff5470;color:#ff6b82;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 9px;min-width:0;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums;line-height:1.2;box-shadow:none;white-space:nowrap}
</style>
</head>
<body>
  <div id="stage">
    <div id="menu" data-hit>
      <div id="slogan">Sinners save the world</div>
      <div class="dv"></div>
      <div class="mi" data-pin="1" title="Pin Norma back to the app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3H7l3-3z"/></svg> Dock</div>
      <div class="mi" data-nav="vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> Vault</div>
      <div class="mi" data-nav="links"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg> Links</div>
      <div class="mi" data-nav="folders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Folders</div>
      <div class="mi" data-nav="shots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3.2"/></svg> Screenies</div>
      <div class="dv"></div>
      <div class="rf-head">Recent Folders</div>
      <div id="rfList" class="rf-list"><div class="rf-empty">no recents yet</div></div>
      <div class="dv"></div>
      <div class="kill-wrap"><button type="button" class="pet-kill" id="petKill" data-kill="1" title="Kill Switch — shut this PC down in 30 minutes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>Kill Switch</span></button></div>
    </div>
    <div id="pet" data-hit><div id="petTimer" aria-hidden="true"><span>30:00</span></div><span class="emo">🤖</span></div>
  </div>
<script>
const E = window.electronAPI || {};
const pet = document.getElementById("pet");
const menu = document.getElementById("menu");
let ignored = true;       // current setIgnoreMouseEvents state
let menuOpen = false;
let MASK = null;          // {GW,GH,solid:Uint8Array} when the image has transparency
let petW = 120, petH = 120;

const PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-3.6 0-6.5 2.8-6.5 6.3 0 4.7 5.6 11.2 6.1 11.8.2.2.6.2.8 0 .5-.6 6.1-7.1 6.1-11.8C18.5 4.8 15.6 2 12 2zm0 8.6a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6z"/></svg>';

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]); }); }

function setIgnoreFalse(){ if(ignored){ E.setMouseIgnore && E.setMouseIgnore(false); ignored=false; } }
function setIgnoreTrue(){ if(!ignored){ E.setMouseIgnore && E.setMouseIgnore(true,{forward:true}); ignored=true; } }

/* downsample the image alpha into a occupancy grid for per-pixel click-through */
function buildMask(img){
  try{
    const ar = img.naturalWidth/img.naturalHeight;
    const GW = 48, GH = Math.max(1, Math.round(48/ar));
    const cv = document.createElement("canvas"); cv.width=GW; cv.height=GH;
    const ctx = cv.getContext("2d"); ctx.drawImage(img,0,0,GW,GH);
    const d = ctx.getImageData(0,0,GW,GH).data;
    const solid = new Uint8Array(GW*GH); let translucent=false; let minGX=GW,maxGX=-1,minGY=GH,maxGY=-1;
    for(let i=0;i<GW*GH;i++){ const a=d[i*4+3]; const s=a>30?1:0; solid[i]=s; if(a<250) translucent=true; if(s){ const gx=i%GW, gy=(i/GW)|0; if(gx<minGX)minGX=gx; if(gx>maxGX)maxGX=gx; if(gy<minGY)minGY=gy; if(gy>maxGY)maxGY=gy; } }
    // size the pet box to the image aspect so the grid maps 1:1 (no letterbox)
    const BASE=120; if(ar>=1){ petW=BASE; petH=Math.round(BASE/ar); } else { petH=BASE; petW=Math.round(BASE*ar); }
    pet.style.width=petW+"px"; pet.style.height=petH+"px";
    MASK = translucent ? {GW,GH,solid,bbox:[minGX,maxGX,minGY,maxGY]} : null;   // fully opaque image -> no passthrough possible
  }catch(e){ MASK=null; petW=120; petH=120; }     // canvas read blocked -> whole-box fallback
}

(function loadFace(){
  const names = ["norma.gif","norma.png","norma.webp"]; let i=0;
  (function next(){
    if(i>=names.length) return;
    const im=new Image();
    im.onload=()=>{ Array.from(pet.children).forEach(c=>{ if(c.id!=="petTimer") c.remove(); }); const img=document.createElement("img"); img.src=names[i]; img.alt="Norma"; img.draggable=false; pet.appendChild(img); if(!document.getElementById("petTimer")){ const t=document.createElement("div"); t.id="petTimer"; t.innerHTML="<span>30:00</span>"; pet.appendChild(t); } buildMask(img); paintKill(); };
    im.onerror=()=>{ i++; next(); };
    im.src=names[i];
  })();
})();

E.setMouseIgnore && E.setMouseIgnore(true, { forward:true });
document.addEventListener("mousemove",(e)=>{
  if(menuOpen){ setIgnoreFalse(); return; }              // whole window interactive while the menu is open
  const el=document.elementFromPoint(e.clientX,e.clientY);
    const inPet = el && el.closest("#pet");
  if(inPet){
    if(MASK){
      const rect=pet.getBoundingClientRect(); const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
      if(cx<0||cy<0||cx>=rect.width||cy>=rect.height){ setIgnoreTrue(); return; }
      const gx=Math.min(MASK.GW-1,Math.max(0,Math.floor(cx/rect.width*MASK.GW)));
      const gy=Math.min(MASK.GH-1,Math.max(0,Math.floor(cy/rect.height*MASK.GH)));
      if(MASK.solid[gy*MASK.GW+gx]) setIgnoreFalse(); else setIgnoreTrue();   // only the character pixels are "solid"
    } else setIgnoreFalse();
  } else {
    setIgnoreTrue();
  }
});

pet.addEventListener("pointerdown",(e)=>{ if(e.button!==0) return; E.petDragStart && E.petDragStart({x:e.clientX,y:e.clientY}); });
window.addEventListener("pointerup",()=>{ E.petDragEnd && E.petDragEnd(); });

function openMenu(){ menu.classList.add("show"); menuOpen=true; setIgnoreFalse(); paintKill(); }
function closeMenu(){ menu.classList.remove("show"); menuOpen=false; paintKill(); }
pet.addEventListener("contextmenu",(e)=>{ e.preventDefault(); menuOpen?closeMenu():openMenu(); });
menu.addEventListener("contextmenu",(e)=>e.preventDefault());
menu.addEventListener("click",doMenuAct);
function doMenuAct(e){
  const nav=e.target.closest("[data-nav]");
  const pin=e.target.closest("[data-pin]");
  const fold=e.target.closest("[data-folder]");
  const kill=e.target.closest("[data-kill]");
  if(!nav&&!pin&&!fold&&!kill) return;
  const now=Date.now();
  if(!kill && now-(doMenuAct._t||0)<400) return;
  doMenuAct._t=now;
  if(kill){
    const act=E.killToggle||null;
    if(act){ Promise.resolve(act(30)).then(function(r){ _petKillAt=(r&&r.armed)?(r.at||0):0; paintKill(); }).catch(function(){}); }
    else if(_petKillAt && _petKillAt>Date.now()){ if(E.killCancel) Promise.resolve(E.killCancel()).catch(function(){}); }
    else if(E.killArm){ Promise.resolve(E.killArm(30)).then(function(r){ if(r&&r.at){ _petKillAt=r.at; paintKill(); } }).catch(function(){}); }
    return;
  }
  if(fold){
    const p=fold.getAttribute("data-folder");
    if(p && E.openPath) E.openPath(p);
    closeMenu();
    return;
  }
  if(nav){ E.petNav && E.petNav(nav.dataset.nav); } else { E.petPin && E.petPin(); }
  closeMenu();
}

function renderRecents(list){
  const box=document.getElementById("rfList");
  if(!box) return;
  list=Array.isArray(list)?list.slice(0,3):[];
  if(!list.length){ box.innerHTML='<div class="rf-empty">no recents yet</div>'; return; }
  box.innerHTML=list.map(function(f){
    const pin=f.pinned?'<span class="rf-pin" title="Pinned">'+PIN_SVG+'</span>':'';
    const name=f.name||f.path||"";
    return '<div class="rf-item" data-folder="'+esc(f.path||'')+'" title="'+esc(f.path||'')+'">'+pin+'<span class="rf-name">'+esc(name)+'</span></div>';
  }).join("");
}

if(E.onRecentFolders) E.onRecentFolders(renderRecents);
if(E.petRecents){ try{ Promise.resolve(E.petRecents()).then(renderRecents).catch(function(){}); }catch(_){} }

let _petKillAt=0;
function killClock(){
  const ms=Math.max(0, (_petKillAt||0)-Date.now());
  const s=Math.ceil(ms/1000);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function paintKill(){
  const b=document.getElementById("petKill");
  const t=document.getElementById("petTimer");
  const armed=!!(_petKillAt && _petKillAt>Date.now());
  if(!armed){
    _petKillAt=0;
    if(b){
      b.classList.remove("armed");
      b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>Arm</span>';
      b.title="Arm kill switch — shut this PC down in 30 minutes";
    }
    if(t) t.classList.remove("show");
    return;
  }
  const clock=killClock();
  if(b){
    b.classList.add("armed");
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>Armed · '+clock+"</span>";
    b.title="Cancel shutdown — "+clock+" left";
  }
  if(t){
    const sp=t.querySelector("span");
    if(sp) sp.textContent=clock;
    t.classList.toggle("show", !menuOpen);
  }
}
if(E.onKillStatus) E.onKillStatus(function(s){ _petKillAt=(s&&s.armed)?(s.at||0):0; paintKill(); });
if(E.killStatus){ try{ Promise.resolve(E.killStatus()).then(function(s){ _petKillAt=(s&&s.armed)?(s.at||0):0; paintKill(); }); }catch(_){} }
setInterval(paintKill, 1000);

</script>
</body>
</html>
